<rect width="2325" height="1688" fill="#fff"/>
<text x="24" y="34" class="title">Tweeter — Post Status (successful) — UML Sequence Diagram</text>
<text x="24" y="54" class="sub">Solid filled arrow = synchronous call · open arrow = asynchronous message over HTTP / Lambda invoke · dashed = return · "await" = call returns a Promise and the caller suspends until it resolves</text>
