<text x="355.0" y="208" text-anchor="middle" class="lbl">submitPost(authToken, currentUser, post)</text>
<path d="M566,252 h28 v22 h-22" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="600" y="267" class="lbl">doFailureReportingOperation(operation, &quot;post the status&quot;, finallyCb)</text>
<line x1="554" y1="302" x2="361" y2="302" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="457.5" y="296" text-anchor="middle" class="lbl">setIsLoading(true)</text>
<line x1="554" y1="340" x2="361" y2="340" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="457.5" y="334" text-anchor="middle" class="lbl">displayInfoMessage(&quot;Posting status...&quot;, 0)</text>
<line x1="361" y1="378" x2="554" y2="378" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="457.5" y="372" text-anchor="middle" class="lbl">postingStatusToastId</text>
<line x1="566" y1="450" x2="685.0" y2="450" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="572" y="422" class="lbl">«create» new Status(post, currentUser, Date.now())</text>
<line x1="566" y1="496" x2="964" y2="496" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="765.0" y="490" text-anchor="middle" class="lbl">await postStatus(authToken, status)</text>
<path d="M976,534 h28 v22 h-22" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1010" y="549" class="lbl">authToken.toDto(), status.dto</text>
<line x1="976" y1="618" x2="1095.0" y2="618" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="982" y="590" class="lbl">«create» new PostFacade()</text>
<line x1="976" y1="664" x2="1169" y2="664" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1072.5" y="658" text-anchor="middle" class="lbl">await postStatus(PostStatusRequest{ authToken, newStatus })</text>
<line x1="1181" y1="702" x2="1374" y2="702" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1277.5" y="696" text-anchor="middle" class="lbl">await doPost(request, &quot;/status/post&quot;)</text>
<line x1="1386" y1="740" x2="1579" y2="740" stroke="#111" stroke-width="1.2" marker-end="url(#open)"/>
<text x="1482.5" y="734" text-anchor="middle" class="lbl">await fetch(POST {SERVER_URL}/status/post, JSON body)</text>
<path d="M1599,786 h268 l12,12 v50 h-280 z" fill="#fffbd6" stroke="#998"/>
<text x="1609" y="804" style="font-size:12px">Integration request: mapping template</text>
<text x="1609" y="820" style="font-size:12px">$input.json(&#x27;$&#x27;) passes the JSON body</text>
<text x="1609" y="836" style="font-size:12px">to Lambda as the event (PostStatusRequest)</text>
<line x1="1591" y1="868" x2="1784" y2="868" stroke="#111" stroke-width="1.2" marker-end="url(#open)"/>
<text x="1687.5" y="862" text-anchor="middle" class="lbl">invoke handler(PostStatusRequest)</text>
<path d="M1796,906 h28 v22 h-22" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1830" y="921" class="lbl">validate authToken, newStatus (else throw &quot;[Bad Request]&quot; → 400)</text>
<path d="M1796,956 h28 v22 h-22" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1830" y="971" class="lbl">AuthToken.fromDto(authToken), Status.fromDto(newStatus)</text>
<line x1="1796" y1="1040" x2="1915.0" y2="1040" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1802" y="1012" class="lbl">«create» new PostService()</text>
<line x1="1796" y1="1086" x2="1989" y2="1086" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1892.5" y="1080" text-anchor="middle" class="lbl">await postStatus(authToken, status)</text>
<line x1="1989" y1="1124" x2="1796" y2="1124" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1892.5" y="1118" text-anchor="middle" class="lbl">Promise&lt;void&gt; resolves</text>
<line x1="1784" y1="1162" x2="1591" y2="1162" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1687.5" y="1156" text-anchor="middle" class="lbl">TweeterResponse { success: true, message }</text>
<path d="M1599,1208 h268 l12,12 v50 h-280 z" fill="#fffbd6" stroke="#998"/>
<text x="1609" y="1226" style="font-size:12px">Integration response: no error regex</text>
<text x="1609" y="1242" style="font-size:12px">matched → default mapping → HTTP 200</text>
<text x="1609" y="1258" style="font-size:12px">+ Access-Control-Allow-Origin header</text>
<line x1="1579" y1="1290" x2="1386" y2="1290" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1482.5" y="1284" text-anchor="middle" class="lbl">HTTP 200, JSON TweeterResponse</text>
<path d="M1386,1328 h28 v22 h-22" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1420" y="1343" class="lbl">resp.ok → await resp.json()</text>
<line x1="1374" y1="1378" x2="1181" y2="1378" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1277.5" y="1372" text-anchor="middle" class="lbl">TweeterResponse</text>
<path d="M1181,1416 h28 v22 h-22" fill="none" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="1215" y="1431" class="lbl">response.success is true</text>
<line x1="1169" y1="1466" x2="976" y2="1466" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1072.5" y="1460" text-anchor="middle" class="lbl">TweeterResponse</text>
<line x1="964" y1="1504" x2="566" y2="1504" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="765.0" y="1498" text-anchor="middle" class="lbl">TweeterResponse (await resumes)</text>
<line x1="554" y1="1542" x2="361" y2="1542" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="457.5" y="1536" text-anchor="middle" class="lbl">setPost(&quot;&quot;)</text>
<line x1="554" y1="1580" x2="361" y2="1580" stroke="#111" stroke-width="1.2" marker-end="url(#fill)"/>
<text x="457.5" y="1574" text-anchor="middle" class="lbl">displayInfoMessage(&quot;Status posted!&quot;, 2000)</text>
