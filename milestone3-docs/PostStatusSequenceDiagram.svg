<text x="1585" y="125.5" text-anchor="middle" class="hd">POST /status/post</text>
<line x1="1790" y1="136" x2="1790" y2="1664" stroke="#777" stroke-dasharray="5 4"/>
<rect x="1710.0" y="90" width="160" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="1790" y="110.5" text-anchor="middle" class="hd" text-decoration="underline">PostStatus Lambda</text>
<text x="1790" y="125.5" text-anchor="middle" class="hd">handler()</text>
<line x1="1995" y1="1063.0" x2="1995" y2="1664" stroke="#777" stroke-dasharray="5 4"/>
<rect x="1915.0" y="1017.0" width="160" height="46" rx="3" fill="#fff" stroke="#111" stroke-width="1.3"/>
<text x="1995" y="1037.5" text-anchor="middle" class="hd" text-decoration="underline">:PostService</text>
<text x="1995" y="1052.5" text-anchor="middle" class="hd">(server)</text>
